<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background-color: #2c3e50 !important
        }

        .navbar-brand { 
            color: #3498db !important; font-weight: 700;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a href="/" class="navbar-brand"><i class="fas fa-brain me-2"></i>LearnHub</a>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 700px">
        <h2 class="mb-1">{{ course.title }}</h2>
        <p class ="text-muted mb-4">{{ course.description }}</p>
        <a href="{% url 'view_enroll' course.id %}" class="btn btn-primary">
            <i class="fas fa-graduation-cap me-1"></i>Enroll Now
        </a>
        <h4>Lessons</h4>
        {% for lesson in lessons %}
        <div class="card p-3 mb-2">
            <h6>{{ lesson.title }}</h6>
            <p>{{ lesson.content }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
